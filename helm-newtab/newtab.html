<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="hello">
        <p class="date" id="date"></p>
        <h1 id="greeting">Hello</h1>
      </div>
      <div class="top-right">
        <div class="clock" id="clock" aria-live="off"></div>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <nav class="links" id="links" aria-label="Quick links"></nav>

    <div class="grid">
      <section class="card" aria-labelledby="todoTitle">
        <div class="card-head">
          <h2 id="todoTitle">Todo</h2>
          <span class="pill" id="todoCount"></span>
        </div>
        <form id="todoForm" class="add">
          <span class="add-plus" aria-hidden="true">+</span>
          <input id="todoInput" type="text" placeholder="Add a task and press Enter" autocomplete="off" maxlength="300">
        </form>
        <ul class="todos" id="todoList"></ul>
        <p class="empty" id="todoEmpty" hidden>Nothing on the list. Enjoy it.</p>
        <details class="done-wrap" id="doneWrap" hidden>
          <summary><span id="doneLabel">Completed</span></summary>
          <ul class="todos done" id="doneList"></ul>
          <button class="text-btn" id="clearDone" type="button">Clear completed</button>
        </details>
      </section>

      <section class="card" aria-labelledby="agentTitle">
        <div class="card-head">
          <h2 id="agentTitle">Agents</h2>
          <span class="meta" id="agentMeta"></span>
          <button class="icon-btn small" id="refreshBtn" aria-label="Refresh agents" title="Refresh">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
        <div class="errors" id="agentErrors" hidden></div>
        <div id="agentBody"></div>
      </section>
    </div>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>

      <label class="field">
        <span>Your name</span>
        <input name="name" type="text" placeholder="For the greeting" autocomplete="off">
      </label>

      <fieldset>
        <legend>GitHub</legend>
        <label class="field">
          <span>Personal access token</span>
          <input name="githubToken" type="password" placeholder="ghp_… or github_pat_…" autocomplete="off" spellcheck="false">
          <small>A classic token with <code>repo</code> scope (or <code>public_repo</code>) works best.
            <a href="https://github.com/settings/tokens/new?scopes=repo&description=Helm%20new%20tab" target="_blank" rel="noopener">Create one</a>.
            Stored only in this browser.</small>
        </label>
        <label class="field">
          <span>Agent patterns</span>
          <input name="agentPatterns" type="text" spellcheck="false">
          <small>Comma-separated. A PR counts as agent work if its author or branch contains one of these.</small>
        </label>
        <label class="check"><input name="agentOnly" type="checkbox"> Only show agent PRs</label>
        <div class="row">
          <label class="field"><span>Look back (days)</span><input name="lookbackDays" type="number" min="1" max="60"></label>
          <label class="field"><span>Refresh every (min)</span><input name="pollMinutes" type="number" min="1" max="120"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Custom agent feed <em>(optional)</em></legend>
        <label class="field">
          <span>JSON feed URL</span>
          <input name="feedUrl" type="url" placeholder="http://127.0.0.1:4317/agents.json" spellcheck="false">
          <small>Any endpoint returning <code>[{ title, status, agent, url }]</code>. See README.</small>
        </label>
      </fieldset>

      <label class="check"><input name="notify" type="checkbox"> Notify me when an agent needs me or finishes</label>

      <label class="field">
        <span>Quick links</span>
        <textarea name="links" rows="4" spellcheck="false" placeholder="Claude Code | https://claude.ai/code"></textarea>
        <small>One per line: <code>Name | URL</code></small>
      </label>

      <p class="form-error" id="settingsError" hidden></p>
      <div class="actions">
        <button type="button" class="text-btn" id="cancelSettings">Cancel</button>
        <button type="submit" class="primary" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="newtab.js"></script>
</body>
</html>
